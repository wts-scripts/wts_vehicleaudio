<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!--
    wts_vehicleaudio - empty loader page (1.1.2)
    Stays blank during the loading screen and character
    selection. The real player (player.html) is only loaded
    when client.lua sends "boot" (player really in game).
-->
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;}</style>
</head>
<body>
<script>
window.addEventListener('message', function (event) {
    if (event.data && event.data.action === 'boot') {
        window.location.replace('player.html');
    }
});
</script>
</body>
</html>
